# SPEC-PLAT-02 R28: weekly, grouped updates with Conventional-Commit titles (repo kit).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    commit-message: { prefix: "build", include: scope }
    labels: [dependencies, frontend]
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react*", "react-router*"]
      tooling:
        patterns: ["vite", "vitest", "@vitest/*", "@vitejs/*", "typescript", "eslint*", "typescript-eslint", "orval"]
      other:
        patterns: ["*"]
        exclude-patterns: ["react", "react-dom", "@types/react*", "react-router*", "vite", "vitest", "@vitest/*", "@vitejs/*", "typescript", "eslint*", "typescript-eslint", "orval"]

  - package-ecosystem: docker
    directory: /docker
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "build" }
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "ci" }
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]
